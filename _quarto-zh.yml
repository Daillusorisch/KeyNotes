# Standalone configuration staged as _quarto.yml by scripts/build_bilingual.py.
# It must not be activated as a profile: Quarto merges chapter lists.
project:
  type: book
  output-dir: _site

lang: zh

book:
  title: "等离子体物理笔记"
  author: "Hongyang Zhou"
  repo-url: https://github.com/henry2004y/KeyNotes/
  repo-branch: master
  repo-subdir: zh
  repo-actions: [edit]
  date: "2026/09/25"
  chapters:
    - index.qmd
    - contents/about.qmd
    - contents/introduction.qmd
    - contents/math.qmd
    - contents/theoretical_mechanics.qmd
    - contents/relativity.qmd
    - contents/unit.qmd
    - contents/single.qmd
    - contents/fluid.qmd
    - contents/diffres.qmd
    - contents/wave.qmd
    - contents/emhd.qmd
    - contents/kinetic.qmd
    - contents/stability.qmd
    - contents/reconnection.qmd
    - contents/kmhd.qmd
    - contents/gyrokinetics.qmd
    - contents/flr.qmd
    - contents/nonlinear.qmd
    - contents/turbulence.qmd
    - contents/geometry.qmd
    - contents/solarwind.qmd
    - contents/shock.qmd
    - contents/magnetosphere.qmd
    - contents/ionosphere.qmd
    - contents/radiationbelt.qmd
    - contents/aurora.qmd
    - contents/gc.qmd
    - contents/cr.qmd
    - contents/boundary.qmd
    - contents/pic.qmd
    - contents/hybrid.qmd
    - contents/dispersion.qmd
    - contents/raytracing.qmd
    - contents/test.qmd
    - contents/inductance.qmd
    - contents/capacitance.qmd
    - contents/appendix.qmd
    - contents/references.qmd

bibliography: files/bibliography.bib

format:
  html:
    css: language-switch.css
    include-after-body: language-switch.html
    theme:
      light: cosmo
      dark: [cosmo, theme-dark.scss]
    code-fold: true

execute:
  enabled: false
  freeze: true
