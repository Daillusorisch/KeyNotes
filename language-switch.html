<script>
(() => {
  const path = window.location.pathname;
  const isChinese = /^zh(?:-|$)/i.test(document.documentElement.lang);
  const chapter = path.match(/\/contents\/([^/]+\.html)$/);
  const destination = chapter
    ? (isChinese ? '../../contents/' : '../zh/contents/') + chapter[1]
    : (isChinese ? '../' : 'zh/');
  const label = isChinese ? 'English' : '中文';
  const button = document.createElement('a');
  const target = new URL(destination, window.location.href);
  target.search = window.location.search;
  target.hash = window.location.hash;
  button.href = target.href;
  button.textContent = label;
  button.className = 'language-switch';
  button.setAttribute('aria-label', label === '中文' ? '切换到中文' : 'Switch to English');
  document.body.appendChild(button);
})();
</script>
